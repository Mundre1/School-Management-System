services:
  # Backend API
  - type: web
    name: school-erp-backend
    env: python
    region: oregon
    buildCommand: |
      cd backend
      pip install -r requirements-sqlite.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: cd backend && gunicorn core.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOW_ALL_ORIGINS
        value: True
      - key: DATABASE_URL
        fromDatabase:
          name: school-erp-db
          property: connectionString

  # PostgreSQL Database
  - type: pgsql
    name: school-erp-db
    region: oregon
    plan: free
    databaseName: school_erp
    databaseUser: school_admin
